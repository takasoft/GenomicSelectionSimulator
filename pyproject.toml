[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genetic-linkage"
version = "0.1.0"
description = "NumPy genetic linkage engine bundled with GenomicSelectionSimulator"
readme = "genetic_linkage/README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = "MIT"
license-files = ["genetic_linkage/LICENSE"]

[project.optional-dependencies]
gui = ["PyQt5", "matplotlib", "h5py"]

[tool.setuptools]
packages = ["genetic_linkage"]
py-modules = ["GenericLinkage"]

[tool.setuptools.package-data]
genetic_linkage = ["README.md", "LICENSE"]
